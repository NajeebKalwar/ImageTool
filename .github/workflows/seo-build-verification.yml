name: SEO build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    name: SEO and build verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          echo "Tracked files:"
          git ls-files
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vF '.env.example'; then
            echo "::error::An environment file is tracked by git"
            exit 1
          fi
          for path in .env .env.production dist/ .astro/ node_modules/; do
            git check-ignore -q "$path" || { echo "::error::$path is not ignored"; exit 1; }
          done

      - name: Verifier self-tests
        run: npm run test:verify

      - name: Real-build integration tests
        run: npm run test:integration

      - name: Preview build (SITE_ENV unset)
        shell: bash
        run: |
          unset SITE_ENV
          rm -rf dist
          npm run build
          npm run verify:preview

      - name: Production build (SITE_ENV=production)
        shell: bash
        env:
          SITE_ENV: production
        run: |
          rm -rf dist
          npm run build
          npm run verify:production

  secret-scan:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"
