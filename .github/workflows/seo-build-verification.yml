name: SEO build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verifier self-tests
        run: npm run test:verify

      - name: Preview build
        shell: bash
        run: |
          unset SITE_ENV
          npm run build
          npm run verify:preview

      - name: Production build from shell environment
        env:
          SITE_ENV: production
        run: |
          rm -rf dist
          npm run build
          npm run verify:production

      - name: Production environment file alignment test
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rm -f .env
          }
          trap cleanup EXIT
          rm -rf dist
          printf 'SITE_ENV=production\n' > .env
          unset SITE_ENV
          npm run build
          npm run verify:production
