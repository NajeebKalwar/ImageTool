name: Synchronize dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lockfile-artifact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only
      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          else
            echo "package-lock.json is already synchronized"
          fi
